name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ====================================================================
  # CỔNG 1: SECRET SCANNING (GITLEAKS)
  # ====================================================================
  secret-scan:
    name: 🔑 Cổng 1 - Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Chay Gitleaks kiem tra Secret
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

    # ====================================================================
  # CỔNG 2: STATIC APPLICATION SECURITY TESTING - SAST (SEMGREP)
  # ====================================================================
  sast-scan:
    name: 🔍 Cổng 2 - SAST Code Audit (Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4

      # Quét mã nguồn và loại trừ thư mục .github để tránh lỗi mutable tag
      # Xuất cả màn hình console VÀ xuất file SARIF báo cáo
      - name: 2. Kich hoat Semgrep quet ma nguon va Security Gate
        run: |
          docker run --rm -v ${{ github.workspace }}:/src returntocorp/semgrep semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --exclude ".github" \
            --error \
            --sarif --output /src/semgrep-results.sarif || true
          
          # In kết quả dạng text ra màn hình đen cho dễ đọc
          docker run --rm -v ${{ github.workspace }}:/src returntocorp/semgrep semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --exclude ".github" \
            --error

      # Luu file bao cao SARIF de nop cho hoi dong
      - name: 3. Luu tru ket qua bao cao Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: semgrep-results.sarif