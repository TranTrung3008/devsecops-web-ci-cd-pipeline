name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ====================================================================
  # CỔNG 1: SECRET SCANNING (GITLEAKS)
  # ====================================================================
  secret-scan:
    name: 🔑 Cổng 1 - Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Chay Gitleaks kiem tra Secret
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

   # ====================================================================
  # CỔNG 2: STATIC APPLICATION SECURITY TESTING - SAST (SEMGREP)
  # ====================================================================
  sast-scan:
    name: 🔍 Cổng 2 - SAST Code Audit (Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4

      # Security Gate: Nếu phát hiện lỗi ERROR / CRITICAL sẽ trả về exit code 1 (FAIL)
      - name: 2. Kich hoat Semgrep quet ma nguon va Security Gate
        run: |
          docker run --rm -v ${{ github.workspace }}:/src returntocorp/semgrep semgrep scan \
            --config "p/javascript" \
            --config "p/owasp-top-ten" \
            --exclude ".github" \
            --error

      - name: 3. Luu tru ket qua bao cao Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: semgrep-results.sarif
          # ====================================================================
  # CỔNG 3: SOFTWARE COMPOSITION ANALYSIS - SCA (TRIVY FS)
  # Mục tiêu: Quét các thư viện dependencies trong package.json
  # ====================================================================
  sca-scan:
    name: 📦 Cổng 3 - SCA Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    # Chỉ chạy Cổng 3 khi Cổng 2 (SAST) đã PASS thành công
    needs: sast-scan
    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4
      # Sử dụng Action chính thức của Aqua Security Trivy
      # Security Gate: exit-code: '1' sẽ chặn pipeline nếu có lỗi HIGH hoặc CRITICAL
      - name: 2. Kich hoat Trivy quet Dependencies va Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
      # Xuat file bao cao dinh dang SARIF de lam minh chung
      - name: 3. Xuat file bao cao SARIF
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-sca-results.sarif'
          severity: 'HIGH,CRITICAL'
      - name: 4. Luu tru Artifacts bao cao SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: trivy-sca-results.sarif
          # ====================================================================
  # CỔNG 4: CONTAINER IMAGE SECURITY (TRIVY IMAGE)
  # Mục tiêu: Đóng gói Docker Image và quét lỗ hổng hệ điều hành nền (Base OS)
  # ====================================================================
  container-scan:
    name: 🐳 Cổng 4 - Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    # Chỉ chạy Cổng 4 sau khi Cổng 3 (SCA) đã PASS
    needs: sca-scan
    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4
      # Tiến hành đóng gói ứng dụng web thành Docker Image
      - name: 2. Build Docker Image
        run: |
          docker build -t target-app:${{ github.sha }} .
      # Kích hoạt Trivy quét trực tiếp Docker Image vừa build
      # Security Gate: Nếu phát hiện lỗi CRITICAL -> Trả về exit code 1 (FAIL PIPELINE)
      - name: 3. Kich hoat Trivy quet Docker Image va Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'target-app:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
      # Xuất báo cáo định dạng SARIF làm minh chứng đồ án
      - name: 4. Xuat bao cao Container Scan SARIF
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'target-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'HIGH,CRITICAL'
      - name: 5. Luu tru Artifacts bao cao Container Scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: trivy-image-results.sarif