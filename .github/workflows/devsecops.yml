name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ====================================================================
  # CỔNG 1: SECRET SCANNING (GITLEAKS)
  # ====================================================================
  secret-scan:
    name: 🔑 Cổng 1 - Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Chay Gitleaks kiem tra Secret
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

   # ====================================================================
  # CỔNG 2: STATIC APPLICATION SECURITY TESTING - SAST (SEMGREP)
  # ====================================================================
  sast-scan:
    name: 🔍 Cổng 2 - SAST Code Audit (Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4

      # Security Gate: Nếu phát hiện lỗi ERROR / CRITICAL sẽ trả về exit code 1 (FAIL)
      - name: 2. Kich hoat Semgrep quet ma nguon va Security Gate
        run: |
          docker run --rm -v ${{ github.workspace }}:/src returntocorp/semgrep semgrep scan \
            --config "p/javascript" \
            --config "p/owasp-top-ten" \
            --exclude ".github" \
            --error

      - name: 3. Luu tru ket qua bao cao Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: semgrep-results.sarif
          # ====================================================================
  # CỔNG 3: SOFTWARE COMPOSITION ANALYSIS - SCA (TRIVY FS)
  # Mục tiêu: Quét các thư viện dependencies trong package.json
  # ====================================================================
  sca-scan:
    name: 📦 Cổng 3 - SCA Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    # Chỉ chạy Cổng 3 khi Cổng 2 (SAST) đã PASS thành công
    needs: sast-scan
    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4
      # Sử dụng Action chính thức của Aqua Security Trivy
      # Security Gate: exit-code: '1' sẽ chặn pipeline nếu có lỗi HIGH hoặc CRITICAL
      - name: 2. Kich hoat Trivy quet Dependencies va Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
      # Xuat file bao cao dinh dang SARIF de lam minh chung
      - name: 3. Xuat file bao cao SARIF
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-sca-results.sarif'
          severity: 'HIGH,CRITICAL'
      - name: 4. Luu tru Artifacts bao cao SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: trivy-sca-results.sarif
  # ====================================================================
  # CỔNG 4: DYNAMIC APPLICATION SECURITY TESTING - DAST (OWASP ZAP)
  # Mục tiêu: Khởi chạy Web thật và quét kiểm thử động từ bên ngoài
  # ====================================================================
  dast-scan:
    name: 🌐 Cổng 4 - DAST Web Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    # Chỉ chạy Cổng 5 sau khi Cổng 4 (Container scan) đã PASS
    needs: sca-scan

    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4

      # Đóng gói và khởi chạy container web chạy ngầm ở port 3000
      - name: 2. Khoi chay ung dung Web ngam trong Runner
        run: |
          docker build -t target-app:dast .
          docker run -d --name my-running-web -p 3000:3000 target-app:dast
          
          # Đợi 5 giây để web server Node.js sẵn sàng lắng nghe request
          sleep 5
          
          # Kiểm tra xem web đã sống chưa (Health Check)
          curl -I http://localhost:3000/ || exit 1
          echo "Web Application is UP and RUNNING on port 3000!"

      # Kích hoạt OWASP ZAP Baseline Scan quét vào http://localhost:3000
      # Sử dụng network host để container ZAP nhìn thấy container Web
      - name: 3. Kich hoat OWASP ZAP Baseline Scan
        run: |
          # Cấp quyền ghi thư mục hiện tại để ZAP xuất file báo cáo
          chmod 777 $(pwd)
          docker run --rm -v $(pwd):/zap/wrk/:rw --network="host" \
            zaproxy/zap-baseline.py -t http://localhost:3000 \
            -r zap-report.html \
            -J zap-report.json || true

      # Dọn dẹp tắt container web sau khi quét xong
      - name: 4. Don dep Container Web
        if: always()
        run: |
          docker stop my-running-web || true
          docker rm my-running-web || true

      # Tải file báo cáo ZAP Report (HTML giao diện đẹp) lên Artifacts
      - name: 5. Luu tru Bao cao OWASP ZAP (HTML & JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-dast-report
          path: |
            zap-report.html
            zap-report.json