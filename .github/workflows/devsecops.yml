name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ====================================================================
  # CỔNG BẢO MẬT SỐ 1: SECRET SCANNING (GITLEAKS)
  # Mục tiêu: Quét và ngăn chặn lộ lọt API Key, Token, Mật khẩu trong code
  # ====================================================================
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo toàn bộ lịch sử commit về máy ảo để Gitleaks soi
      - name: 1. Checkout ma nguon (Fetch-depth = 0)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bước 2: Kích hoạt Gitleaks quét toàn bộ dự án
      # Security Gate: Nếu phát hiện secret lộ, Gitleaks tự động trả về Exit Code 1 (FAIL PIPELINE)
      - name: 2. Chay Gitleaks Action kiem tra Secret
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true